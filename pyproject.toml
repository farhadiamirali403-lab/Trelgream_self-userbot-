[project]
name = "telegram-saas"
version = "0.1.0"
description = "Multi-tenant Telegram Userbot SaaS platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "telethon>=1.41",
    "redis>=5.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "tenacity>=8.2",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
